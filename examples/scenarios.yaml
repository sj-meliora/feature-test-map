# 예시 데이터다. 실제 기능에 대해 작성한 시나리오가 아니다.
#
# 인스턴스 시나리오 레코드(DP-7). 레코드 하나가 인스턴스 시나리오 하나다.
#   id                고유 ID. "<기능 ID>.S<번호>" 형식이다.
#   feature_id        시나리오가 속한 기능의 ID. 검증 대상인 말단 기능이어야 한다.
#   stimulus          자극
#   environment       환경
#   response          응답
#   response_measure  응답 측정
#
# 검증 대상인 기능마다 시나리오를 하나씩 둔다. NS-CREATE에는 두 번째
# 시나리오(NS-CREATE.S2)를 추가한 상태를 예로 든다.

- id: NS-CREATE.S1
  feature_id: NS-CREATE
  stimulus: 호스트가 Namespace Management 커맨드(Create)를 보낸다.
  environment: 미할당 용량이 요청한 크기 이상이고, namespace 수가 최대보다 적다.
  response: 새 NSID를 할당하고, Identify 결과에 새 namespace를 반영한다.
  response_measure: 완료 상태가 Successful Completion이고, Identify Namespace의 크기가 요청한 크기와 같다.

- id: NS-CREATE.S2
  feature_id: NS-CREATE
  stimulus: 호스트가 Namespace Management 커맨드(Create)를 보낸다.
  environment: 미할당 용량이 요청한 크기보다 작다.
  response: namespace를 만들지 않고 오류로 완료한다.
  response_measure: 완료 상태가 Namespace Insufficient Capacity이고, namespace 수가 변하지 않는다.

- id: NS-DELETE.S1
  feature_id: NS-DELETE
  stimulus: 호스트가 Namespace Management 커맨드(Delete)를 보낸다.
  environment: 삭제할 namespace가 존재하고 컨트롤러에 attach되어 있지 않다.
  response: namespace를 삭제하고 용량을 미할당 용량으로 되돌린다.
  response_measure: 완료 상태가 Successful Completion이고, 미할당 용량이 삭제한 크기만큼 늘어난다.

- id: FORMAT.S1
  feature_id: FORMAT
  stimulus: 호스트가 Format NVM 커맨드를 보낸다.
  environment: 지원하는 LBA 형식을 지정하고, 진행 중인 I/O가 없다.
  response: LBA 형식을 바꾸고, 지정한 경우 사용자 데이터를 삭제한다.
  response_measure: Identify Namespace의 LBA 형식이 지정한 값과 같고, 삭제한 영역을 읽으면 0 또는 정해진 값이 나온다.

- id: SANITIZE.S1
  feature_id: SANITIZE
  stimulus: 호스트가 Sanitize 커맨드(Block Erase)를 보낸다.
  environment: 사용자 데이터가 기록되어 있다.
  response: 모든 사용자 데이터를 삭제하고, Sanitize Status 로그에 완료를 기록한다.
  response_measure: 모든 LBA를 읽으면 삭제된 값이 나오고, Sanitize Status가 성공을 나타낸다.

- id: FLUSH.S1
  feature_id: FLUSH
  stimulus: 호스트가 쓰기 커맨드 뒤에 Flush 커맨드를 보낸다.
  environment: 휘발성 쓰기 캐시가 켜져 있다.
  response: 캐시에 있는 데이터를 비휘발성 매체에 기록한 뒤 Flush를 완료한다.
  response_measure: Flush 완료 직후 전원을 끊고 다시 켜도 기록한 데이터를 읽을 수 있다.

- id: PS-TRANSITION.S1
  feature_id: PS-TRANSITION
  stimulus: 호스트가 Set Features(Power Management)로 다른 power state를 지정한다.
  environment: 진행 중인 I/O가 없다.
  response: 지정한 power state로 전환한다.
  response_measure: Get Features 결과가 지정한 power state이고, 전환 지연 시간이 규격 안에 든다.

- id: SPOR.S1
  feature_id: SPOR
  stimulus: 쓰기를 진행하는 중에 예고 없이 전원이 꺼진 뒤 다시 켜진다.
  environment: 휘발성 쓰기 캐시가 켜져 있다.
  response: 매핑 정보를 복구하고 커맨드를 받을 수 있는 상태가 된다.
  response_measure: 전원이 꺼지기 전에 완료 응답을 보낸 쓰기 데이터를 모두 읽을 수 있다.
