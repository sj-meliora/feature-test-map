# 예시 데이터다. 실제 IMS structure에서 추출한 내용이 아니다.
#
# 기능 레코드(DP-1). 레코드 하나가 기능 하나다.
#   id          고유 ID. 사용자가 직접 부여한다.
#   name        이름
#   path        계층 경로. 상위 항목의 이름을 " > "로 잇는다.
#   parent_id   부모 ID. 최상위 항목은 null이다.
#   description 자연어 설명
#   ims_ref     IMS 원본 위치
#
# 자식 항목이 없는 말단 항목이 검증 대상이다. 아래에서 NS는 묶음이고,
# NS-CREATE와 NS-DELETE가 검증 대상이다.

- id: NS
  name: Namespace Management
  path: Namespace Management
  parent_id: null
  description: >-
    호스트가 namespace를 생성하고 삭제하는 기능의 묶음이다.
  ims_ref: IMS-EX-0100

- id: NS-CREATE
  name: Namespace Create
  path: Namespace Management > Namespace Create
  parent_id: NS
  description: >-
    Namespace Management 커맨드(Create)로 미할당 용량에서 새 namespace를
    만들고 NSID를 할당한다. 용량이 부족하거나 namespace 수가 최대에
    도달하면 오류로 완료한다.
  ims_ref: IMS-EX-0101

- id: NS-DELETE
  name: Namespace Delete
  path: Namespace Management > Namespace Delete
  parent_id: NS
  description: >-
    Namespace Management 커맨드(Delete)로 namespace를 삭제하고 그 용량을
    미할당 용량으로 되돌린다.
  ims_ref: IMS-EX-0102

- id: FORMAT
  name: Format NVM
  path: Format NVM
  parent_id: null
  description: >-
    Format NVM 커맨드로 LBA 형식을 바꾸고, 지정한 경우 사용자 데이터를
    삭제한다.
  ims_ref: IMS-EX-0200

- id: SANITIZE
  name: Sanitize
  path: Sanitize
  parent_id: null
  description: >-
    Sanitize 커맨드로 모든 사용자 데이터를 복구할 수 없게 삭제한다.
    진행 중에 전원이 꺼져도 다시 켜진 뒤 동작을 이어서 완료한다.
  ims_ref: IMS-EX-0300

- id: FLUSH
  name: Flush
  path: Flush
  parent_id: null
  description: >-
    Flush 커맨드로 휘발성 쓰기 캐시의 데이터를 비휘발성 매체에 기록한다.
  ims_ref: IMS-EX-0400

- id: PS-TRANSITION
  name: Power State Transition
  path: Power State Transition
  parent_id: null
  description: >-
    Set Features(Power Management)로 지정한 power state로 전환하고,
    전환 지연 시간이 규격 안에 든다.
  ims_ref: IMS-EX-0500

- id: SPOR
  name: Sudden Power-Off Recovery
  path: Sudden Power-Off Recovery
  parent_id: null
  description: >-
    예고 없이 전원이 꺼진 뒤 다시 켜지면 매핑 정보를 복구하고, 완료 응답을
    보낸 쓰기 데이터를 잃지 않는다.
  ims_ref: IMS-EX-0600
