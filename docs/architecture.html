<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Feature-Test Map 전체 구조도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 색: 레코드 관계도와 같은 밝은 단일 테마. 어두운 테마를 따로 두지 않는다. */
/* 배치: 왼쪽에서 오른쪽으로 원천, 작성 시점, 원본, 질의 시점의 네 구획. 그 아래에 범례, 제안 목록, 미결 목록을 둔다. */
:root {
  --bg: #f7f8fa;
  --card: #ffffff;
  --zone: #eef1f5;
  --ink: #1f2937;
  --body: #4b5563;
  --muted: #6b7280;
  --line: #d3dbe5;
  --accent: #2b6cb0;
  --navy: #1e3a5f;
  --slate: #46658c; --slate-line: #8ea7c6; --slate-soft: #e2e9f2;
  --brown: #9a6b45; --brown-line: #c9a17e; --brown-soft: #f3e9df;
  --green: #4f7f73; --green-line: #8fb5aa; --green-soft: #e4eeea;
  --prop: #b45309; --prop-soft: #fdf0dc;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 14px; line-height: 1.6;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1460px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 0 14px; align-items: stretch; }
header::before { content: ""; background: var(--accent); border-radius: 3px; }
header div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; }
header p { margin: 0; color: var(--accent); font-size: 15px; font-weight: 600; }
figure { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; min-width: 0; overflow: hidden; }
.scroll { overflow-x: auto; }
.scroll > svg { display: block; width: 100%; min-width: 1180px; height: auto; }

/* 범례 */
figcaption { border-top: 1px solid var(--line); background: var(--card); padding: 14px 18px; display: grid; gap: 10px; }
figcaption p { margin: 0; color: var(--body); font-size: 13.5px; max-width: 110ch; }
.marks { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 10px; }
.marks > span { display: inline-flex; align-items: center; gap: 7px; }
.chip { width: 16px; height: 14px; border-radius: 3px; border: 1.5px solid var(--line); background: var(--card); }
.chip.llm { background: var(--slate-soft); border-color: var(--slate-line); }
.chip.human { background: var(--brown-soft); border-color: var(--brown-line); }
.chip.script { background: var(--green-soft); border-color: var(--green-line); }
.chip.prop { border-color: var(--prop); border-style: dashed; }
.chip.open { border-color: var(--muted); border-style: dashed; background: var(--bg); }
.sw { width: 24px; height: 0; border-top: 2px solid var(--ink); }
.sw.open { border-top: 2px dashed var(--muted); }

/* 캔버스 */
svg text { font-family: var(--sans); fill: var(--ink); }
.zone { fill: var(--zone); stroke: var(--line); stroke-width: 1; }
svg text.zname { font-size: 14px; font-weight: 700; fill: var(--navy); }
svg text.zsub { font-size: 12px; fill: var(--muted); }
.box { stroke-width: 1.6; }
.box.llm { fill: var(--slate-soft); stroke: var(--slate-line); }
.box.human { fill: var(--brown-soft); stroke: var(--brown-line); }
.box.script { fill: var(--green-soft); stroke: var(--green-line); }
.box.plain { fill: var(--card); stroke: var(--line); }
.box.prop { stroke: var(--prop); stroke-dasharray: 7 4; }
.box.open { fill: var(--bg); stroke: var(--muted); stroke-dasharray: 4 4; }
svg text.st { font-family: var(--mono); font-size: 10.5px; font-weight: 600; fill: var(--muted); }
svg text.st.llm { fill: var(--slate); }
svg text.st.human { fill: var(--brown); }
svg text.st.script { fill: var(--green); }
svg text.name { font-size: 14.5px; font-weight: 700; }
svg text.name.dim { fill: var(--muted); }
svg text.desc { font-size: 12px; fill: var(--body); }
.pill { stroke-width: 1; }
.pill.prop { fill: var(--prop-soft); stroke: var(--prop); }
.pill.open { fill: var(--card); stroke: var(--muted); }
.pill.fmt { fill: var(--card); stroke: var(--line); }
svg text.ptxt { font-family: var(--mono); font-size: 10.5px; font-weight: 600; }
svg text.ptxt.prop { fill: var(--prop); font-family: var(--sans); }
svg text.ptxt.open { fill: var(--muted); font-family: var(--sans); }
svg text.ptxt.fmt { fill: var(--muted); }
.flow { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.flow.open { stroke: var(--muted); stroke-dasharray: 5 4; }
.tip { fill: var(--ink); }
.tip.open { fill: var(--muted); }
svg text.lbl { font-size: 12px; font-weight: 500; fill: var(--ink); }
svg text.lbl.open { fill: var(--muted); }

/* 뷰 공통 표기 */
figure + figure { margin-top: 0; }
.vtitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--card); }
.vtitle b { font-size: 15px; color: var(--navy); }
.vtitle span { font-size: 12.5px; color: var(--muted); }
.frame { fill: var(--card); stroke: var(--ink); stroke-width: 1.4; }
.frame.prop { stroke: var(--prop); stroke-dasharray: 7 4; }
.frame.repo { fill: var(--zone); stroke: var(--slate); }
.inner { fill: var(--green-soft); stroke: var(--green-line); stroke-width: 1.3; }
.inner.db { fill: var(--card); stroke: var(--slate-line); }
.port { fill: var(--card); stroke: var(--ink); stroke-width: 1.3; }
svg text.iname { font-size: 13px; font-weight: 700; }
svg text.idesc { font-size: 11.5px; fill: var(--body); }
.badge { fill: var(--prop-soft); stroke: var(--prop); stroke-width: 1.2; }
svg text.btxt { font-size: 11px; font-weight: 700; fill: var(--prop); }
.conn { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.conn.data { stroke-dasharray: 7 4; }
.conn.talk { stroke: var(--brown); }
.conn.open { stroke: var(--muted); stroke-dasharray: 2 4; }
.conn.dep { stroke-dasharray: 7 4; }
.conn.tie { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 3; }
.tip-o { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.tip-h { fill: var(--brown); }
svg text.lbl.talk { fill: var(--brown); }
svg text.lbl.mono { font-family: var(--mono); font-size: 11.5px; }
.pkg { fill: var(--zone); stroke: var(--slate); stroke-width: 1.3; }
.pkg.outer { fill: none; stroke: var(--line); }
svg text.pname { font-size: 13.5px; font-weight: 700; fill: var(--navy); }
.note { fill: var(--prop-soft); stroke: var(--prop); stroke-width: 1.2; }
svg text.nhead { font-family: var(--mono); font-size: 11px; font-weight: 600; fill: var(--prop); }
svg text.ntxt { font-size: 12px; fill: var(--ink); }
svg text.ntxt.b { font-weight: 700; }
.lg { display: inline-block; width: 30px; height: 12px; }

/* 아래 표 */
.grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; }
section { min-width: 0; }
h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; color: var(--navy); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-weight: 700; font-size: 12px; color: var(--slate); background: var(--slate-soft); white-space: nowrap; }
td { color: var(--body); }
td.n { white-space: nowrap; color: var(--prop); font-weight: 700; }
td.t { color: var(--ink); font-weight: 600; min-width: 15ch; }
ul.rules { margin: 0; padding: 0; list-style: none; display: grid; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
ul.rules li { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; color: var(--body); }
ul.rules li:last-child { border-bottom: 0; }
ul.rules b { font-weight: 700; font-size: 13px; color: var(--muted); }
p.foot { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 100ch; }
@media (max-width: 860px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  ul.rules li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
</style>
</head>

    <figcaption>
      <p>원본 저장소의 텍스트 파일이 원본이며, 조회용 SQLite DB는 원본에서 생성한다. DB 생성은 사용자가 실행할 때에만 동작한다. 조회 스크립트는 DB를 만들지 않으며, DB가 없거나 원본보다 오래되었으면 오류로 종료한다. 질의 에이전트는 기능과 인스턴스 시나리오를 전체로 읽어 질의의 의미를 기능 ID로 바꾸고, TC와 관계는 읽기 전용 조회 스크립트에 SQL을 보내어 조회한다.</p>
      <div class="marks">
        <span><span class="chip llm"></span>컴포넌트 (LLM 에이전트)</span>
        <span><span class="chip script"></span>컴포넌트</span>
        <span><span class="chip human"></span>액터</span>

        <span><svg class="lg" viewBox="0 0 30 12"><path class="conn talk" d="M3,6 H27" marker-end="url(#ctiph)" marker-start="url(#ctiph)"/></svg>사람과 에이전트의 대화</span>

  <figure>

    <div class="scroll">
<svg viewBox="0 0 1460 520" role="img" aria-label="Module View. 저장소 안에 스킬 패키지와 기능 추출, TC 추출, 관계 식별 모듈이 있다. 스킬 패키지는 조회 스크립트, 안내 문서, DB 생성, 테이블·뷰 정의로 구성된다. DB 생성과 조회 스크립트는 테이블·뷰 정의를 사용하고, 안내 문서는 DB 생성이 만드는 스키마를 설명한다.">
<defs>
